name: Publish Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build and validate distributions
        run: ./gradlew --no-daemon buildPluginVariants -PpluginVersion="$VERSION"

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin -PpluginVersion="$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--title "$RELEASE_TAG" --generate-notes --verify-tag)
          if [[ "$RELEASE_TAG" == *beta* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
